<html><body>
<h2>v8b SyncSafe</h2>
<pre id="r"></pre>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}

L('UA: '+navigator.userAgent);
L('Cores: '+navigator.hardwareConcurrency);
L('Mem: '+(navigator.deviceMemory||'?')+'GB');

// Sync XHR with AbortController-style safety:
// Only probe localhost (TCP RST is instant) and known-live Adobe hosts
function sx(url,label){
  var t=Date.now();
  try{
    var x=new XMLHttpRequest();
    x.open('GET',url,false);
    x.send();
    var dt=Date.now()-t;
    var rt=(x.responseText||'');
    L(label+': s='+x.status+' len='+rt.length+' t='+dt+'ms');
    if(x.status>0){
      var h=x.getAllResponseHeaders();
      if(h)L('  H: '+h.replace(/\r?\n/g,' | ').substring(0,500));
      if(rt.length>0&&rt.length<1500)L('  B: '+rt.substring(0,1500));
    }
  }catch(e){
    L(label+': '+e.name+' t='+(Date.now()-t)+'ms');
  }
}

// === LOCALHOST HTTPS PORT SCAN ===
// TCP RST for closed ports = instant, TLS cert error for open = fast
L('\n== lo HTTPS scan ==');
sx('https://127.0.0.1/','443');
sx('https://127.0.0.1:4443/','4443');
sx('https://127.0.0.1:6443/','6443');
sx('https://127.0.0.1:8443/','8443');
sx('https://127.0.0.1:9090/','9090');
sx('https://127.0.0.1:10250/','10250');
sx('https://127.0.0.1:2379/','2379');
sx('https://127.0.0.1:3000/','3000');
sx('https://127.0.0.1:5000/','5000');
sx('https://127.0.0.1:8080/','8080');
sx('https://127.0.0.1:8888/','8888');
sx('https://127.0.0.1:9200/','9200');
sx('https://127.0.0.1:9222/','9222');
sx('https://127.0.0.1:27017/','27017');
sx('https://127.0.0.1:6379/','6379');
sx('https://127.0.0.1:5432/','5432');

// === ADOBE INTERNAL (public DNS, valid certs, should respond fast) ===
L('\n== Adobe HTTPS ==');
sx('https://senseicore-ue1.adobe.io/','sensei');
sx('https://dc-argus.adobe.io/','argus');
sx('https://platform-cs-jpn3.adobe.io/','platcs');
sx('https://dc-genai-content-platform-v2-jpn3.adobe.io/','genai');
sx('https://dc-graph-proxy.adobe.io/','graphprx');
sx('https://dcdiscovery.adobe.io/','discovery');
sx('https://dc-api-v2-jpn3.adobe.io/','dcapi');

// === ENV FINGERPRINT ===
L('\n== Env ==');
try{var tz=Intl.DateTimeFormat().resolvedOptions();L('tz: '+tz.timeZone+' locale='+tz.locale);}catch(e){}
try{L('conn: type='+navigator.connection.type+' eff='+navigator.connection.effectiveType+' dl='+navigator.connection.downlink+'Mbps rtt='+navigator.connection.rtt+'ms');}catch(e){L('conn: n/a');}
try{L('cookieEnabled: '+navigator.cookieEnabled);}catch(e){}
try{var m=performance.memory;L('heap: limit='+m.jsHeapSizeLimit+' used='+m.usedJSHeapSize+' total='+m.totalJSHeapSize);}catch(e){}
try{L('screen: '+screen.width+'x'+screen.height+' avail='+screen.availWidth+'x'+screen.availHeight+' dpr='+devicePixelRatio);}catch(e){}

// WebGL
L('\n== WebGL ==');
try{
  var c=document.createElement('canvas');
  var gl=c.getContext('webgl');
  var dbg=gl.getExtension('WEBGL_debug_renderer_info');
  if(dbg){
    L('vendor: '+gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
    L('renderer: '+gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
  }else{
    L('vendor: '+gl.getParameter(gl.VENDOR));
    L('renderer: '+gl.getParameter(gl.RENDERER));
  }
  L('version: '+gl.getParameter(gl.VERSION));
  L('shading: '+gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
  L('maxTexSz: '+gl.getParameter(gl.MAX_TEXTURE_SIZE));
}catch(e){L('WebGL: '+e.message);}

// Permissions API
L('\n== Permissions ==');
var perms=['geolocation','notifications','camera','microphone','clipboard-read','clipboard-write'];
var permResults=[];
perms.forEach(function(p){
  try{
    navigator.permissions.query({name:p}).then(function(r){
      permResults.push(p+'='+r.state);
      if(permResults.length===perms.length)R.textContent+='perms: '+permResults.join(', ')+'\n';
    });
  }catch(e){permResults.push(p+'=err');}
});

// Cache/SW/IDB (async but rendered before busy-wait ends)
L('\n== Storage ==');
try{caches.keys().then(function(n){R.textContent+='cacheNames: '+JSON.stringify(n)+'\n';});}catch(e){L('caches: '+e.message);}
try{navigator.serviceWorker.getRegistrations().then(function(r){R.textContent+='SW: '+r.length+'\n';});}catch(e){L('SW: '+e.message);}
try{indexedDB.databases().then(function(d){R.textContent+='IDB: '+d.length+(d.length>0?' '+JSON.stringify(d):'')+'\n';});}catch(e){L('IDB: '+e.message);}

// localStorage/sessionStorage
try{L('localStorage keys: '+Object.keys(localStorage).length);if(Object.keys(localStorage).length>0)L('  keys: '+JSON.stringify(Object.keys(localStorage)));}catch(e){L('localStorage: '+e.message);}
try{L('sessionStorage keys: '+Object.keys(sessionStorage).length);}catch(e){L('sessionStorage: '+e.message);}

// Performance resource entries
L('\n== Perf ==');
try{
  var entries=performance.getEntriesByType('resource');
  L('resources: '+entries.length);
  entries.forEach(function(e){
    if(e.name.indexOf('github')>-1)return;
    var dns=(e.domainLookupEnd-e.domainLookupStart).toFixed(0);
    var tcp=(e.connectEnd-e.connectStart).toFixed(0);
    var tls=e.secureConnectionStart>0?(e.connectEnd-e.secureConnectionStart).toFixed(0):'0';
    L('  '+e.name.substring(0,80)+' dns='+dns+' tcp='+tcp+' tls='+tls+'ms');
  });
}catch(e){}

// SDP
L('\n== SDP ==');
try{
  var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.createDataChannel('d');
  pc.createOffer().then(function(o){
    pc.setLocalDescription(o);
    o.sdp.split('\n').forEach(function(l){
      l=l.trim();
      if(l.indexOf('c=')===0||l.indexOf('a=candidate')===0||l.indexOf('o=')===0||l.indexOf('a=fingerprint')===0)
        R.textContent+=l+'\n';
    });
  });
}catch(e){L('SDP: '+e.message);}

// Busy wait
L('\n== Wait 6s ==');
var start=Date.now();
while(Date.now()-start<6000){}
L('Done t='+(Date.now()-start)+'ms');
L('== END v8b ==');
</script>
</body></html>
