<html><body style="background:#fff;color:#000;font-family:monospace;font-size:9px;margin:4px;line-height:1.15;">
<b>v12 CORS-Auth</b>
<pre id="r" style="color:#000;white-space:pre-wrap;word-break:break-all;margin:0;"></pre>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}
L('v12 Cores:'+navigator.hardwareConcurrency);

var API_KEY='dc-prod-virgoweb';

// Helper: fetch with full response dump
function probe(url,label,opts){
  opts=opts||{};
  var headers=opts.headers||{};
  fetch(url,{
    mode:'cors',
    credentials:opts.credentials||'omit',
    headers:headers
  }).then(function(resp){
    var cors=resp.headers.get('access-control-allow-origin');
    var ct=resp.headers.get('content-type');
    var ah=resp.headers.get('access-control-allow-headers');
    var am=resp.headers.get('access-control-allow-methods');
    R.textContent+=label+': s='+resp.status+' type='+resp.type+' cors='+cors+' ct='+ct+'\n';
    if(ah)R.textContent+='  allow-headers: '+ah+'\n';
    if(am)R.textContent+='  allow-methods: '+am+'\n';
    // Dump all response headers
    var allH=[];
    resp.headers.forEach(function(v,k){allH.push(k+':'+v);});
    R.textContent+='  headers: '+allH.join(' | ')+'\n';
    if(resp.type!=='opaque'&&resp.status>0){
      resp.text().then(function(body){
        R.textContent+=label+' BODY('+body.length+'): '+body.substring(0,800)+'\n';
      });
    }
  }).catch(function(e){
    R.textContent+=label+': ERR '+e.message+'\n';
  });
}

// === 1. CORS PREFLIGHT TEST (OPTIONS request) ===
L('\n== CORS Preflight Tests ==');
// Manually send OPTIONS to check what headers are allowed
['https://dcdiscovery.adobe.io/','https://platform-cs-edge-jpn3.adobe.io/','https://dcdiscovery.adobe.io/1785845424/index'].forEach(function(url){
  var label='OPT-'+url.replace('https://','').substring(0,30);
  fetch(url,{
    method:'OPTIONS',
    mode:'cors',
    headers:{
      'Access-Control-Request-Method':'GET',
      'Access-Control-Request-Headers':'x-api-key,authorization'
    }
  }).then(function(resp){
    var ah=resp.headers.get('access-control-allow-headers');
    var ao=resp.headers.get('access-control-allow-origin');
    var am=resp.headers.get('access-control-allow-methods');
    R.textContent+=label+': s='+resp.status+' ao='+ao+' ah='+ah+' am='+am+'\n';
    var allH=[];resp.headers.forEach(function(v,k){allH.push(k+':'+v);});
    R.textContent+='  all: '+allH.join(' | ')+'\n';
  }).catch(function(e){
    R.textContent+=label+': ERR '+e.message+'\n';
  });
});

// === 2. SIMPLE GET (no custom headers) to CORS-enabled services ===
L('\n== Simple GET (no auth) ==');
// dcdiscovery paths
probe('https://dcdiscovery.adobe.io/','disc-root');
probe('https://dcdiscovery.adobe.io/health','disc-health');
probe('https://dcdiscovery.adobe.io/status','disc-status');
probe('https://dcdiscovery.adobe.io/version','disc-version');
probe('https://dcdiscovery.adobe.io/1785845424/index','disc-idx');
probe('https://dcdiscovery.adobe.io/1785845424/','disc-1785');

// platform-cs-edge paths
probe('https://platform-cs-edge-jpn3.adobe.io/','edge-root');
probe('https://platform-cs-edge-jpn3.adobe.io/health','edge-health');
probe('https://platform-cs-edge-jpn3.adobe.io/status','edge-status');
probe('https://platform-cs-edge-jpn3.adobe.io/version','edge-version');

// === 3. GET WITH x-api-key (triggers preflight) ===
L('\n== GET with x-api-key ==');
probe('https://dcdiscovery.adobe.io/1785845424/index','disc-idx-key',{headers:{'x-api-key':API_KEY}});
probe('https://dcdiscovery.adobe.io/','disc-root-key',{headers:{'x-api-key':API_KEY}});
probe('https://platform-cs-edge-jpn3.adobe.io/','edge-root-key',{headers:{'x-api-key':API_KEY}});
probe('https://platform-cs-edge-jpn3.adobe.io/health','edge-health-key',{headers:{'x-api-key':API_KEY}});

// === 4. GET WITH x-api-key + Accept header ===
L('\n== GET with api-key + Accept ==');
probe('https://dcdiscovery.adobe.io/1785845424/index','disc-idx-full',{
  headers:{
    'x-api-key':API_KEY,
    'Accept':'application/json'
  }
});
probe('https://platform-cs-edge-jpn3.adobe.io/dckwcs/1785845424/kwcollections','edge-kwc',{
  headers:{
    'x-api-key':API_KEY,
    'Accept':'application/json'
  }
});

// === 5. TRY OTHER CORS-POSSIBLE SERVICES ===
L('\n== Other services (simple GET) ==');
// Try various Adobe microservice patterns
var otherUrls=[
  ['https://dc-us1.adobe.io/','dc-us1'],
  ['https://dc-jpn3.adobe.io/','dc-jpn3'],
  ['https://adobecontent.io/','content'],
  ['https://dc-kwcollection.adobe.io/','kwc-schema'],
  ['https://assets.adobeusercontent.com/','assets-uc'],
  ['https://cc-api-storage.adobe.io/','cc-storage'],
  ['https://ims-na1.adobelogin.com/ims/check/v6/token','ims-check'],
  ['https://adobeid-na1.services.adobe.com/','adobeid']
];
otherUrls.forEach(function(t){
  probe(t[0],t[1]);
});

// === 6. TEST CORS WITH CREDENTIALS (might send cookies if any) ===
L('\n== CORS with credentials ==');
probe('https://dcdiscovery.adobe.io/1785845424/index','disc-cred',{credentials:'include'});
probe('https://platform-cs-edge-jpn3.adobe.io/','edge-cred',{credentials:'include'});

// === 7. POST requests (might reveal different CORS behavior) ===
L('\n== POST tests ==');
fetch('https://dcdiscovery.adobe.io/1785845424/index',{
  method:'POST',
  mode:'cors',
  headers:{'Content-Type':'text/plain'},
  body:'test'
}).then(function(r){
  R.textContent+='disc-POST: s='+r.status+' type='+r.type+'\n';
  if(r.type!=='opaque')r.text().then(function(t){R.textContent+='  body: '+t.substring(0,300)+'\n';});
}).catch(function(e){R.textContent+='disc-POST: '+e.message+'\n';});

fetch('https://platform-cs-edge-jpn3.adobe.io/dckwcs/1785845424/kwcollections',{
  method:'POST',
  mode:'cors',
  headers:{'Content-Type':'text/plain'},
  body:'{}'
}).then(function(r){
  R.textContent+='edge-POST: s='+r.status+' type='+r.type+'\n';
  if(r.type!=='opaque')r.text().then(function(t){R.textContent+='  body: '+t.substring(0,300)+'\n';});
}).catch(function(e){R.textContent+='edge-POST: '+e.message+'\n';});

// Busy wait
L('\n== Wait 10s ==');
var start=Date.now();
while(Date.now()-start<10000){}
L('Done t='+(Date.now()-start)+'ms');
</script>
</body></html>
